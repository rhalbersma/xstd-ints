name: s390x

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

# No push or pull_request: the tests run under QEMU, several times slower
# than on a native leg, so this leg runs nightly alone.
on:
  # canary.yml dispatches this nightly on main, the run its README badge shows.
  workflow_dispatch:

jobs:
  # Big-endian: the one leg where an integer's first byte is its highest, so
  # a byte copy or a test that assumes otherwise fails here and nowhere else.
  s390x:
    uses: rhalbersma/cpp-ci/.github/workflows/s390x.yml@30a05bf5457c28e3e0f2e394fbcb89fc3c45b405 # main after rhalbersma/cpp-ci#84, which rewrites the support headers a mapping names
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test
