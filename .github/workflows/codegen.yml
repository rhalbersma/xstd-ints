name: Codegen

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # A native runner per architecture, since each one's instructions are checked only on itself. The tests compile to
  # assembly and link nothing, so a leg takes seconds once the toolchain is in place.
  codegen:
    name: ${{ matrix.runner }} ${{ matrix.compiler }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ ubuntu-24.04, ubuntu-24.04-arm ]
        compiler: [ g++-15, clang++-22 ]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the stable rung, CMake and FileCheck
        run: |
          tools/setup-toolchain.sh
          pip install --quiet --user --break-system-packages --require-hashes -r tools/cmake-requirements.txt
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
        run: cmake -S . -B build -DCMAKE_CXX_COMPILER="${CXX}" -DBUILD_TESTING=OFF -DXSTD_INTS_BUILD_CODEGEN_TESTS=ON

      - name: Check the assembly
        run: ctest --test-dir build --output-on-failure

  # The one name branch protection requires, red unless every leg above succeeded.
  all:
    name: codegen / all
    if: always()
    needs: codegen
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded
        env:
          RESULT: ${{ needs.codegen.result }}
        run: test "${RESULT}" = success
