name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@5e70b2dfcf6a2a4d8f8d442c65703588d198548c # v0.11.1
