name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # v0.14.0
