name: Clang libc++

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to.
  clang_libcxx:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-libc++.yml@8156138fa6336f5d870e72e62b72033632a1c56b # v0.9.0
