name: Layering

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The headers' layering, read from their #include lines: the shared detail/ includes no public header, the folders
  # form no cycle, every public header is a leaf that only umbrellas include, and each folder's own detail/ is private.
  layering:
    name: layering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: rhalbersma/cpp-ci/.github/actions/layering@0e0b8a1ec3476589bb39dc798d41551e18165916 # main after rhalbersma/cpp-ci#90, which adds the layering action
        with:
          config: tools/layering.toml
