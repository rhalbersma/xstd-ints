name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # One input, and not about the rungs: this library is C++23 and builds on every
  # stable rung, which is what the shared workflow defaults to. A repository
  # needing a newer compiler names the rung instead of the version, and this one
  # may yet.
  sanitizers_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@30a05bf5457c28e3e0f2e394fbcb89fc3c45b405 # main after rhalbersma/cpp-ci#84, which rewrites the support headers a mapping names
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test

  # The name branch protection requires: green when the ladder passed, or when
  # the pull request changes nothing the ladder builds.
  all:
    name: sanitizers / all
    needs: [ changes, sanitizers_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.sanitizers_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
