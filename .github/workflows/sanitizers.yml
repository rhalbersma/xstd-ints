name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # One input, and not about the rungs: this library is C++23 and builds on every
  # stable rung, which is what the shared workflow defaults to. A repository
  # needing a newer compiler names the rung instead of the version, and this one
  # may yet.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@1c32e510e25b1d41e613cddc1b169655680f9a01 # v0.12.0
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test
