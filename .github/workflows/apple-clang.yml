name: Apple Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Two rungs, not three: Apple publishes no Clang trunk, and the shared
  # workflow drops the development rung with a notice rather than failing.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@8156138fa6336f5d870e72e62b72033632a1c56b # v0.9.0
