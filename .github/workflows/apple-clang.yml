name: Apple Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Two rungs, not three: Apple publishes no Clang trunk, and the shared
  # workflow drops the development rung with a notice rather than failing.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@4ccffd02f1a880e23597610589c47be5320eb1bd # main, past v0.9.0
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test
