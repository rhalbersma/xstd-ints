name: MSVC-Analyze

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # MSVC's /analyze, in the role Clang-Tidy fills on the other side. Its one
  # input is not about the ladder, and the default underneath moved: v0.7.0 runs all three MSVC rungs
  # rather than the qualification one alone, which is what Clang-Tidy has done
  # since v0.6.0. The C++ Core Guidelines checkers stay off until there is a
  # reason to turn them on.
  msvc_analyze_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/msvc-analyze.yml@1b5265b916e459cfe621a970e819b6b16a29c3c5 # main after rhalbersma/cpp-ci#81, whose install-gcc falls back to the Launchpad librarian when the toolchain PPA's mirror is down
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test

  # The name branch protection requires: green when the ladder passed, or when
  # the pull request changes nothing the ladder builds.
  all:
    name: msvc_analyze / all
    needs: [ changes, msvc_analyze_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.msvc_analyze_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
