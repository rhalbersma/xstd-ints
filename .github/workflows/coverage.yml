name: Coverage

# id-token for Codecov's tokenless upload; the shared workflow cannot exceed
# what is granted here.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The Codecov CLI only queues an upload, so a report dropped on their side
  # greys the badge with every leg green; the daily re-upload self-heals that.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  # One hundred percent of include/. This restates the shared default rather
  # than inheriting it, so the bar is readable here and a change to the default
  # cannot lower it without a commit in this repository. xstd-bits and tabula
  # state theirs for the same reason; tabula's is a ratchet below 100.
  coverage:
    uses: rhalbersma/cpp-ci/.github/workflows/coverage.yml@480aa17d38efd5c1641b861e9e1a0c6df053a451 # v0.10.3
    with:
      fail_under_line: 100
      fail_under_branch: 100
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test
