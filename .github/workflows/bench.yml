name: Bench

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# By hand, and on a pull request that touches the kernels or the benchmarks. A benchmark reports what a runner does
# and never fails on a number, so this is not a check to require; each run's tables land in its job summary.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'include/xstd/ints/bit/detail/**'
      - 'bench/**'
      - '.github/workflows/bench.yml'

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 15, x86-64
            runner: ubuntu-24.04
            compiler: g++-15
            flags: '-march=native'
          - name: Clang 22, x86-64
            runner: ubuntu-24.04
            compiler: clang++-22
            flags: '-march=native'
          - name: GCC 15, AArch64
            runner: ubuntu-24.04-arm
            compiler: g++-15
            flags: '-mcpu=native'
          - name: Clang 22, AArch64
            runner: ubuntu-24.04-arm
            compiler: clang++-22
            flags: '-mcpu=native'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the stable rung and CMake
        run: |
          tools/setup-toolchain.sh
          pip install --quiet --user --break-system-packages --require-hashes -r tools/cmake-requirements.txt
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
          FLAGS: ${{ matrix.flags }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="${CXX}" -DCMAKE_CXX_FLAGS="${FLAGS}" -DBUILD_TESTING=OFF -DXSTD_INTS_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Measure
        run: build/bench/bench_bit_permutation | tee -a "${GITHUB_STEP_SUMMARY}"

  # The checked-in llvm-mca output, regenerated; a difference is reported, not failed, since a point release moves it.
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the stable rung, CMake and an AArch64 standard library
        run: |
          tools/setup-toolchain.sh
          sudo apt-get install -y -qq libstdc++-14-dev-arm64-cross
          pip install --quiet --user --break-system-packages --require-hashes -r tools/cmake-requirements.txt
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Fetch zp7
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-22 -DBUILD_TESTING=OFF -DXSTD_INTS_BUILD_BENCHMARKS=ON

      - name: Analyse
        run: python3 bench/static_analysis.py --zp7 build/_deps/zp7-src

      - name: Compare with the checked-in analysis
        run: |
          {
            echo '```diff'
            git diff --stat -- bench/mca
            git diff -- bench/mca/README.md
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
