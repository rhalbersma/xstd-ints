name: MinGW

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # One input, and not about the ladder: this library builds on every rung the
  # shared workflow offers, which for MinGW is two -- it drops the development
  # rung with a notice rather than failing, as it does for Apple Clang.
  mingw:
    uses: rhalbersma/cpp-ci/.github/workflows/mingw.yml@1c32e510e25b1d41e613cddc1b169655680f9a01 # main, past v0.11.1
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test
