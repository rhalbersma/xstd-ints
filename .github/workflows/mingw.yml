name: MinGW

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # One input, and not about the ladder: this library builds on every rung the
  # shared workflow offers, which for MinGW is two -- it drops the development
  # rung with a notice rather than failing, as it does for Apple Clang.
  mingw_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/mingw.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test

  # The name branch protection requires: green when the ladder passed, or when
  # the pull request changes nothing the ladder builds.
  all:
    name: mingw / all
    needs: [ changes, mingw_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.mingw_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
