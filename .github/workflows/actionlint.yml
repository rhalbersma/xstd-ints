name: Actionlint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: the defaults are the policy this repository already had.
  actionlint:
    uses: rhalbersma/cpp-ci/.github/workflows/actionlint.yml@95dead5b4064510969ca3991849f7c63cf643079 # v0.10.0
