name: Actionlint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: the defaults are the policy this repository already had.
  actionlint:
    uses: rhalbersma/cpp-ci/.github/workflows/actionlint.yml@8156138fa6336f5d870e72e62b72033632a1c56b # v0.9.0
