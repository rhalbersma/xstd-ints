name: Changes

permissions:
  contents: read

on:
  workflow_call:
    outputs:
      build:
        description: >
          'true' unless the event is a pull request whose every changed file is
          one no compiler ladder builds; 'false' only then.
        value: ${{ jobs.changes.outputs.build }}

jobs:
  # Whether a pull request can reach the library or its unit tests. Every other
  # event builds: a push to main, the schedule, a manual run and the canary
  # check the whole tree whatever changed.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.diff.outputs.build }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'pull_request'
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Compare with the base
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" != pull_request ]; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git diff --name-only "${BASE}" HEAD > "${RUNNER_TEMP}/changed"
          cat "${RUNNER_TEMP}/changed"
          # Paths no ladder compiles: prose but the README, whose examples are
          # tests, the suites with workflows of their own, the tools those use,
          # the site's configuration, and the workflows that are not ladders.
          # Anything else, a new directory included, builds.
          unbuilt='\.md$|^LICENSE_1_0\.txt$|^doc/|^bench/|^codegen/|^constant_time/|^exhaustive/|^fuzz/|^mutation/|^proofs/|^tools/|^mkdocs\.yml$|^\.clang-format$|^\.git-blame-ignore-revs$'
          unbuilt="${unbuilt}"'|^\.github/workflows/(actionlint|bench|canary|cflite_batch|cflite_pr|clang-format|codegen|codeql|constant-time|consumption|coverage|exhaustive|mutation|pages|proofs|scorecard|upstream-watch)\.yml$'
          if grep -qvE "${unbuilt}" "${RUNNER_TEMP}/changed" || grep -qx 'README\.md' "${RUNNER_TEMP}/changed"; then
            echo "build=true" >> "${GITHUB_OUTPUT}"
          else
            echo "build=false" >> "${GITHUB_OUTPUT}"
          fi
