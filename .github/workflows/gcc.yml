name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # One input, and not about the ladder: this library builds on every rung,
  # which is what the shared workflow defaults to.
  gcc_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test

  # 32-bit x86: a 32-bit size_t, 4-byte alignment for 64-bit integers, and no
  # __int128. One rung in Debug, since what is under test is the target.
  i686:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      arch: x86
      tiers: stable
      build_types: Debug
      vcpkg_features: test

  # The hardware kernels: x86-64-v3 makes PEXT and PDEP fast, which every leg
  # above leaves to the portable kernels. One rung and one build type suffice,
  # the instructions being the processor's rather than the compiler's.
  gcc_bmi2:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      tiers: stable
      build_types: Release
      cxx_flags: -march=x86-64-v3
      vcpkg_features: test

  # The name branch protection requires: green when the ladder passed, or when
  # the pull request changes nothing the ladder builds.
  all:
    name: gcc / all
    needs: [ changes, gcc_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.gcc_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
