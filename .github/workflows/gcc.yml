name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # One input, and not about the ladder: this library builds on every rung,
  # which is what the shared workflow defaults to.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test

  # 32-bit x86: a 32-bit size_t, 4-byte alignment for 64-bit integers, and no
  # __int128. One rung in Debug, since what is under test is the target.
  i686:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      arch: x86
      tiers: stable
      build_types: Debug
      vcpkg_features: test

  # The hardware kernels: x86-64-v3 makes PEXT and PDEP fast, which every leg
  # above leaves to the portable kernels. One rung and one build type suffice,
  # the instructions being the processor's rather than the compiler's.
  gcc_bmi2:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      tiers: stable
      build_types: Release
      cxx_flags: -march=x86-64-v3
      vcpkg_features: test

  # C++29 on the trunk snapshot, the one mode in which libstdc++ declares
  # std::shl and std::shr, and P3104's permutations after them: the only leg
  # where the overloads forwarding to <bit> compile and their agreement tests
  # run. A flag rather than a CMake standard, since CMake knows no C++29 yet;
  # seeing the mode in CMAKE_CXX_FLAGS, it adds no -std of its own. One build
  # type, since what is under test is the standard library's.
  gcc_cxx29:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@170191bd9ab421d871b53fb67682376a2695d8a9 # v0.13.0
    with:
      tiers: development
      build_types: Debug
      cxx_flags: -std=gnu++2d
      vcpkg_features: test
