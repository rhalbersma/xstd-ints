name: Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Whether this pull request can reach what the ladders build; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  clang_tidy_ladder:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/clang-tidy.yml@8d989e750414e76f4832e755e1439ccf449f904c # main after rhalbersma/cpp-ci#85, which reads dg-xfail-run-if and pins GCC trunk's test suite
    with:
      # The generated per-header units, as run-clang-tidy matches them against
      # the compile database's absolute paths. They are the one tree that cannot
      # be named as a directory: they live in the build tree, under a path only
      # this project's CMake knows.
      self_sufficiency_regex: ${{ github.workspace }}/build/test/header_self_sufficiency/.*
      # The Boost.Test sources under src/ and the death tests under death/.
      test_dir: test
      # config/ is generated per platform and not a public header.
      include_exclude: include/xstd/config/*
      # The ext/ headers need the library each adapts: the two int128 libraries
      # Configure fetches, and Boost.Hash2, which vcpkg installs.
      adapted_dirs: >-
        build/_deps/absl_int128-src
        build/_deps/boost_int128-src/include
        vcpkg_installed/x64-linux/include
        build/vcpkg_installed/x64-linux/include
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test

  # The name branch protection requires: green when the ladder passed, or when
  # the pull request changes nothing the ladder builds.
  all:
    name: clang_tidy / all
    needs: [ changes, clang_tidy_ladder ]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Every leg succeeded, or none was needed
        env:
          BUILD: ${{ needs.changes.outputs.build }}
          RESULT: ${{ needs.clang_tidy_ladder.result }}
        run: test "${BUILD}" = false || test "${RESULT}" = success
