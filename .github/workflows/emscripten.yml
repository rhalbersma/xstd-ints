name: Emscripten

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # Whether this pull request can reach what the ladder builds; see changes.yml.
  changes:
    uses: ./.github/workflows/changes.yml

  # wasm32 under node: a 32-bit size_t like i686, but 8-byte alignment for
  # 64-bit integers and a native __int128, so it catches what i686 cannot.
  wasm32:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: rhalbersma/cpp-ci/.github/workflows/emscripten.yml@2a7b3577168d22d62a9119b1913c6e0122e78994 # v0.14.0
    with:
      # Boost.Test, which vcpkg.json keeps out of its default features so that
      # consuming this library resolves no Boost at all.
      vcpkg_features: test
