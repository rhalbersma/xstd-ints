name: Scorecard

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  # scorecard-action refuses to publish results from a workflow whose top-level
  # permissions grant write: the token that signs them must be scoped to the job
  # that needs it. A workflow-level grant fails the upload with HTTP 400 while
  # the job still reports success, so the badge silently stops moving. See
  # https://github.com/ossf/scorecard-action#workflow-restrictions
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: rhalbersma/cpp-ci/.github/workflows/scorecard.yml@4ccffd02f1a880e23597610589c47be5320eb1bd # main, past v0.9.0
