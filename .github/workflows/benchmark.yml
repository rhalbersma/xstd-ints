name: Benchmark

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# By hand, and on a pull request that touches the kernels or the benchmarks. A benchmark reports what a runner does
# and never fails on a number, so this is not a check to require; each run's tables land in its job summary.
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'include/xstd/ints/bit/detail/**'
      - 'benchmark/**'
      - '.github/workflows/benchmark.yml'

jobs:
  measure:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC 15, x86-64
            runner: ubuntu-24.04
            compiler: g++-15
            flags: '-march=native'
          - name: Clang 22, x86-64
            runner: ubuntu-24.04
            compiler: clang++-22
            flags: '-march=native'
          - name: GCC 15, AArch64
            runner: ubuntu-24.04-arm
            compiler: g++-15
            flags: '-mcpu=native'
          - name: Clang 22, AArch64
            runner: ubuntu-24.04-arm
            compiler: clang++-22
            flags: '-mcpu=native'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the stable rung and CMake
        run: |
          tools/setup-toolchain.sh --stable
          pip install --quiet --user --break-system-packages --require-hashes -r tools/cmake-requirements.txt
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Configure
        env:
          CXX: ${{ matrix.compiler }}
          FLAGS: ${{ matrix.flags }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER="${CXX}" -DCMAKE_CXX_FLAGS="${FLAGS}" -DBUILD_TESTING=OFF -DXSTD_INTS_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Measure
        run: build/benchmark/bench_bit_permutation | tee -a "${GITHUB_STEP_SUMMARY}"

  # The checked-in llvm-mca and uiCA output, regenerated; a difference is reported, not failed, since releases move it.
  analyse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the stable rung, CMake and an AArch64 standard library
        run: |
          tools/setup-toolchain.sh --stable
          sudo apt-get install -y -qq libstdc++-14-dev-arm64-cross
          pip install --quiet --user --break-system-packages --require-hashes -r tools/cmake-requirements.txt
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Fetch zp7
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-22 -DBUILD_TESTING=OFF -DXSTD_INTS_BUILD_BENCHMARKS=ON

      # uiCA pinned by commit; its setup builds XED's Python module and converts uops.info's current instruction data.
      - name: Install uiCA
        env:
          UICA: ${{ runner.temp }}/uiCA
        run: |
          git clone --quiet https://github.com/andreas-abel/uiCA.git "${UICA}"
          git -C "${UICA}" checkout --quiet 6ebeeab0f8705cae4b17a9362f9c65ef91f5cc44
          cd "${UICA}" && ./setup.sh

      - name: Analyse
        env:
          UICA: ${{ runner.temp }}/uiCA
        run: python3 benchmark/static_analysis.py --zp7 build/_deps/zp7-src --uica "${UICA}/uiCA.py"

      - name: Compare with the checked-in analysis
        run: |
          {
            echo '```diff'
            git status --short -- benchmark
            git diff -- benchmark/mca/README.md benchmark/uica/README.md
            echo '```'
            cat benchmark/uica/README.md
          } | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Print uiCA's reports
        run: tail -n +1 benchmark/uica/*.txt
