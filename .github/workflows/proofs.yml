name: Proofs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Weekly, by hand, and on a pull request that touches the kernels or their proofs. Not a required check: a path filter
# would leave it pending on every pull request that does not.
on:
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'include/xstd/ints/bit/detail/portable/**'
      - 'test/proofs/**'
      - 'tools/z3-requirements.txt'
      - '.github/workflows/proofs.yml'

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the stable rung, its 32-bit multilib, CMake and Z3
        run: |
          tools/setup-toolchain.sh --stable
          sudo apt-get install -y -qq g++-15-multilib
          pip install --quiet --user --break-system-packages --require-hashes -r tools/cmake-requirements.txt
          pip install --quiet --user --break-system-packages --require-hashes -r tools/z3-requirements.txt
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++-15 -DBUILD_TESTING=OFF -DXSTD_INTS_BUILD_PROOFS=ON -DXSTD_INTS_PROOFS_DRIFT_32=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Prove, and hold the models to the compiled kernels
        run: ctest --test-dir build --output-on-failure --verbose
