# libc++'s tests of what xstd mirrors, rewritten from std:: onto xstd::, with each departure from them named.

[libcxx]
take = [
    { path = "libcxx/test/std/numerics/bit", select = 'std::(bit_ceil|bit_floor|bit_width|byteswap|countl_one|countl_zero|countr_one|countr_zero|has_single_bit|popcount|rotl|rotr)\b' },
    { path = "libcxx/test/std/numerics/c.math", select = 'struct correct_size_int' },
    { path = "libcxx/test/std/utilities/meta/meta.trans/meta.trans.sign" },
    { path = "libcxx/test/std/utilities/meta/meta.unary/meta.unary.prop", select = 'std::is_(un)?signed\b' },
    { path = "libcxx/test/std/language.support/support.limits/limits" },
    { path = "libcxx/test/std/utilities/charconv/charconv.to.chars" },
]
support = [
    { path = "libcxx/test/support/charconv_test_helpers.h" },
]
include = ["xstd_types.hpp"]
rewrite = [
    { regex = '(?<![\w:])std::(abs|bit_ceil|bit_floor|bit_width|byteswap|countl_one|countl_zero|countr_one|countr_zero|has_single_bit|is_signed|is_signed_v|is_unsigned|is_unsigned_v|make_signed|make_signed_t|make_unsigned|make_unsigned_t|numeric_limits|popcount|rotl|rotr|to_chars)\b', to = 'xstd::\1' },
]

[[libcxx.assertion]]
file = "libcxx/test/std/numerics/bit/bit.pow.two/bit_ceil.pass.cpp"
sha256 = "9926b931672e7003b18de075981455e78ee3dbe7573a1a13ee1e1c121da27d9a"
line = "LIBCPP_ASSERT_NOEXCEPT(std::bit_ceil(T()));"
drop = true
departure = "[bit.pow.two] gives bit_ceil a precondition and no noexcept, which libc++ adds as an extension and xstd does not"

[[libcxx.assertion]]
file = "libcxx/test/std/numerics/c.math/abs.pass.cpp"
sha256 = "ebb98e9cb04b73c9b9c53aeae29c39ed211551e5059688d51599dcfd4055f035"
line = "test_abs<long double, long double>();"
drop = true
departure = "xstd::abs takes integers only; [c.math.abs]'s floating-point overloads stay <cmath>'s"

[[libcxx.assertion]]
file = "libcxx/test/std/numerics/c.math/abs.pass.cpp"
sha256 = "ebb98e9cb04b73c9b9c53aeae29c39ed211551e5059688d51599dcfd4055f035"
line = "test_abs<double, double>();"
drop = true
departure = "xstd::abs takes integers only; [c.math.abs]'s floating-point overloads stay <cmath>'s"

[[libcxx.assertion]]
file = "libcxx/test/std/numerics/c.math/abs.pass.cpp"
sha256 = "ebb98e9cb04b73c9b9c53aeae29c39ed211551e5059688d51599dcfd4055f035"
line = "test_abs<float, float>();"
drop = true
departure = "xstd::abs takes integers only; [c.math.abs]'s floating-point overloads stay <cmath>'s"

[[libcxx.assertion]]
file = "libcxx/test/std/numerics/c.math/abs.pass.cpp"
sha256 = "ebb98e9cb04b73c9b9c53aeae29c39ed211551e5059688d51599dcfd4055f035"
line = "test_abs<SignedChar, int>();"
drop = true
departure = "xstd::abs takes an integer, which plain char is not: like wchar_t and the charN_t, it is neither half of its own signed and unsigned pair"

# The types xstd implements itself, which libc++ cannot name, run each bit test's assertions after the standard ones.

[[libcxx.assertion]]
file = "libcxx/test/std/numerics/bit/bit.pow.two/bit_ceil.pass.cpp"
sha256 = "9926b931672e7003b18de075981455e78ee3dbe7573a1a13ee1e1c121da27d9a"
line = "static_assert(test<std::size_t>());"
to = "static_assert(test<std::size_t>()); XSTD_TYPES_UNSIGNED_CONSTEXPR(XSTD_TYPES_STATIC_TEST)"
departure = "the types xstd implements itself run the same assertions: bit-precise widths to 256 and the 128-bit classes"

[[libcxx.assertion]]
file = "libcxx/test/std/numerics/bit/bit.pow.two/bit_ceil.pass.cpp"
sha256 = "9926b931672e7003b18de075981455e78ee3dbe7573a1a13ee1e1c121da27d9a"
line = "test<std::size_t>();"
to = "test<std::size_t>(); XSTD_TYPES_UNSIGNED(XSTD_TYPES_TEST)"
departure = "the types xstd implements itself run the same assertions: bit-precise widths to 256 and the 128-bit classes"

