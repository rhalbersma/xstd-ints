# GCC trunk's tests of what xstd mirrors and no GCC release has yet, rewritten from std:: onto xstd::.

[libstdcxx]
take = [
    { path = "libstdc++-v3/testsuite/26_numerics/bit/bit.permute" },
    { path = "libstdc++-v3/testsuite/26_numerics/bit/bit.shift" },
]
include = ["xstd_types.hpp"]
rewrite = [
    { regex = '(?<![\w:])std::(bit_compress|bit_expand|bit_repeat|bit_reverse|is_signed_v|numeric_limits|popcount|shl|shr)\b', to = 'xstd::\1' },
]
